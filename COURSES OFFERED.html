<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Courses Offered By the University</title>
	<style>
		 :root {
            --primary-color: #2b6cb0;
            --primary-hover: #2c5282;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 { text-align: center; color: var(--primary-color); margin-bottom: 25px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); }
        fieldset { border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
        legend { font-weight: bold; color: var(--primary-color); padding: 0 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        label { font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #4a5568; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: var(--primary-color); }
        input[readonly] { background-color: #edf2f7; cursor: not-allowed; font-weight: 600; }
        .fee-breakdown { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .fee-breakdown th, .fee-breakdown td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .fee-breakdown td input { padding: 6px; }
        .payment-methods { display: flex; gap: 20px; }
        .btn-container { text-align: center; margin-top: 10px; }
        button[type="submit"] { background-color: var(--primary-color); color: white; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button[type="submit"]:hover { background-color: var(--primary-hover); }

        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-group.full-width { grid-column: span 1; } }
	</style>
</head>
<body>

</body>
</html>
