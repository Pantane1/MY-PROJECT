<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Accommodation Booking</title>
    <style>
        :root {
            --primary-color: green;
            --primary-hover: blue;
            --card-bg: white ;
            --text-color: black;
            --border-color: green;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: red;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .info-text {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Hostel & Accommodation Booking</h2>
    
    <form action="/submit-accommodation" method="POST">
        
        <!-- Student Details Section -->
        <div class="form-group">
            <label for="reg-number">Registration Number</label>
            <input type="text" id="reg-number" name="reg_number" placeholder="BIT/2022/54822" required>
        </div>

        <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full_name" placeholder="OTIENO DANIEL" required>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="gender" value="male" required> Male
                </label>
                <label class="radio-option">
                    <input type="radio" name="gender" value="female"> Female
                </label>
                </label>
                <label class="radio-option">
                    <input type="radio" name="gender" value="allien"> Allien
                </label>

            </div>
        </div>

        <!-- Accommodation Preferences -->
        <div class="form-group">
            <label for="campus">Select Campus Location</label>
            <select id="campus" name="campus" required>
                <option value="">-- Select Preferred Campus --</option>
                <option value="main">Main Campus Thika</option>
                <option value="city">Nairibi Campus</option>
                <option value="west">Kisumu Campus</option>
                <option value="main">Mombasa Campus</option>
                <option value="city">Nairibi Campus</option>
                <option value="west">Kisumu ODEL Center</option>
            </select>
        </div>

        <div class="form-group">
            <label for="room-type">Preferred Room Type</label>
            <select id="room-type" name="room_type" required>
                <option value="">-- Select Preferred Room --</option>
                <option value="single">Single Room</option>
                <option value="double">Sharing Room For maximum OF 2</option>
                <option value="quad">Sharing Room for maximum  4</option>
            </select>
        </div>


        <!-- Accomodation Terms and Agreement -->
        <div class="form-group">
            <label class="radio-option" style="font-weight: normal;">
                <input type="checkbox" name="terms" required> I agree to the Mount Kenya University housing rules and conditions set.
            </label>
        </div>

        <button type="submit">Submit Application For Booking</button>
    </form>
</div>

</body>
</html>
